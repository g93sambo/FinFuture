# A generic, single database configuration with async SQLAlchemy support.

[alembic]
# Path to migration scripts
script_location = db/migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path path, prepended to sys.path
prepend_sys_path = .

# Timezone
timezone = UTC

# Version path separator
version_path_separator = os

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
