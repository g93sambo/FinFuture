name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        # Network-free: conftest isolates the DB, disables broker/LLM keys and uses the in-memory cache
        env:
          PYTHONPATH: backend:.
        run: python -m pytest backend/tests tests/e2e_research tests/unit -q -p no:cacheprovider
      - name: Production config guard refuses insecure settings
        working-directory: backend
        env:
          ENVIRONMENT: production
          OTP_DEV_ECHO: "true"
        run: |
          if python -c "from core.config import settings" 2>/dev/null; then
            echo "Production settings loaded with default secrets and OTP_DEV_ECHO=true" && exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:prod
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://finfuture.onrender.com
